version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react*"
      vite-plus:
        patterns:
          - vite-plus
          - "@vitest/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
